<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Grupo Santo</title><style>body{margin:0;background:#061426;color:#fff;font-family:system-ui}.wrap{max-width:1100px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#0b2038;border:1px solid #21415f;border-radius:16px;padding:16px;margin:12px 0}.stat{font-size:30px;font-weight:900;color:#f4c24b}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #21415f;text-align:left}button{padding:9px;border:0;border-radius:8px;font-weight:700}.ok{background:#55d68b}.sel{background:#102b48;color:#fff;border:1px solid #21415f;padding:8px;border-radius:8px}</style></head><body><div class="wrap"><h1>Panel administrativo · Grupo Santo</h1><div id="stats" class="grid"></div><div class="card"><h2>Estudiantes y matrículas</h2><div id="table">Cargando...</div></div></div><script>async function load(){const s=await fetch('/api/admin/stats').then(r=>r.json());stats.innerHTML=`<div class="card">Estudiantes<div class="stat">${s.students}</div></div><div class="card">Pagados<div class="stat">${s.paid}</div></div><div class="card">Pendientes<div class="stat">${s.pending}</div></div>`;const data=await fetch('/api/admin/students').then(r=>r.json());table.innerHTML='<table><tr><th>Estudiante</th><th>Contacto</th><th>Curso</th><th>Estado</th></tr>'+data.flatMap(x=>(x.enrollments||[]).map(e=>`<tr><td>${x.full_name}</td><td>${x.phone||''}</td><td>${e.course_id}</td><td><select class="sel" onchange="setStatus('${e.id}',this.value)"><option>${e.status}</option><option>pending</option><option>paid</option><option>active</option><option>completed</option><option>cancelled</option></select></td></tr>`)).join('')+'</table>'}async function setStatus(id,status){await fetch('/api/admin/enrollment/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});load()}load();</script></body></html>
